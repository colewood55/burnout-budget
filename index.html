<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Burnout Budget — Life Event Draw</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #111;
      color: #f0f0f0;
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    header {
      background: #ffffff;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 24px;
      padding: 24px 48px;
      border-bottom: 3px solid #E8380D;
    }

    #fireCanvas { display: none; }

    /* Logo inline SVG */
    .logo-wrap {
    }
    .logo-wrap svg {
      width: 280px;
      height: auto;
    }

    /* Title block */
    .title-block {
      text-align: center;
    }
    .title-block h1 {
      font-size: clamp(2.8rem, 4.5vw, 5rem);
      font-weight: 900;
      color: #0a0a0a;
      letter-spacing: -0.04em;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(255,255,255,0.6);
    }

    /* Cards remaining pill */
    .status-pill {
      background: #111;
      border-radius: 10px;
      padding: 10px 18px;
      text-align: center;
      white-space: nowrap;
    }
    .status-pill .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #E8380D;
      text-transform: uppercase;
    }
    .status-pill .count {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
    }
    .status-pill .count span { color: #888; }

    /* ── TOOLBAR ─────────────────────────────────────────── */
    .toolbar {
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-left { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      border-radius: 6px;
      border: 1.5px solid #E8380D;
      background: transparent;
      color: #E8380D;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      letter-spacing: .3px;
    }
    .btn:hover { background: #E8380D; color: #fff; }
    .btn svg { width: 15px; height: 15px; fill: currentColor; }

    .toolbar-hint {
      font-size: 12.5px;
      color: #666;
    }

    /* ── MAIN ────────────────────────────────────────────── */
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 24px 60px;
    }

    /* ── ROUND ROW ───────────────────────────────────────── */
    .round-row {
      background: #1c1c1c;
      border: 1.5px solid #333;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 90px 130px 1fr;
      gap: 16px;
      align-items: center;
    }
    .round-row.active { border-color: #E8380D; }

    .round-label {
      text-align: center;
    }
    .round-label .round-word {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
    }
    .round-label .round-num {
      font-size: 3.2rem;
      font-weight: 900;
      color: #E8380D;
      line-height: 1;
    }

    .round-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .round-controls .ctrl-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
    }
    .roll-btn {
      background: #E8380D;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      letter-spacing: .3px;
    }
    .roll-btn:hover { background: #c42d08; }
    .roll-btn:disabled { background: #444; color: #666; cursor: default; }

    .die-display {
      width: 48px; height: 48px;
      background: #111;
      border: 2px solid #444;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 900;
      color: #E8380D;
    }
    .die-display.rolled { border-color: #E8380D; }

    .drawn-count {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    /* ── CARD GRID ───────────────────────────────────────── */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-start;
    }

    .card-slot {
      width: 90px;
      height: 126px;
      border-radius: 6px;
      cursor: pointer;
      perspective: 600px;
      flex-shrink: 0;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .4s ease;
      border-radius: 6px;
    }
    .card-slot.flipped .card-inner { transform: rotateY(180deg); }

    .card-face, .card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 6px;
      overflow: hidden;
    }

    /* Card back — undrawn */
    .card-back {
      background: #fff;
      border: 1.5px solid #ddd;
      overflow: hidden;
    }
    .card-slot.undrawn .card-back { cursor: default; }

    /* Card face — drawn */
    .card-face {
      transform: rotateY(180deg);
      background: white;
      border: 1.5px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s, box-shadow .2s;
    }
    .card-slot.flipped .card-face:hover {
      transform: rotateY(180deg) scale(1.05);
      box-shadow: 0 8px 30px rgba(232,56,13,0.5);
      z-index: 10;
    }

    .card-face img, .card-face svg-embed {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .card-face .card-svg-wrapper {
      width: 100%;
      height: 100%;
    }
    .card-face .card-svg-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Card modal overlay */
    #cardModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #cardModal.visible {
      display: flex;
    }
    #cardModal img {
      width: min(340px, 80vw);
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────────── -->
<header>
  <div class="logo-wrap">
    <img src="assets/Header logo.png" alt="Burnout Budget" style="width:280px;height:auto;"/>
  </div>

  <div class="title-block">
    <h1>Life Event Draw</h1>
  </div>

  <div class="status-pill">
    <div class="label">Cards Remaining</div>
    <div class="count" id="cardsRemaining">50<span>/50</span></div>
  </div>

  <canvas id="fireCanvas"></canvas>
</header>

<!-- ── TOOLBAR ────────────────────────────────────────────── -->
<div id="cardModal"><img id="cardModalImg" src="" alt=""/></div>
<div class="toolbar">
  <div class="toolbar-left">
    <button class="btn" onclick="shuffleDeck()">
      <svg viewBox="0 0 24 24"><path d="M16 3h5v5l-1.8-1.8-4.7 4.7-1.4-1.4 4.7-4.7L16 3zM4.1 20.1l4.7-4.7-1.4-1.4-4.7 4.7L1 17v5h5l-1.9-1.9zM16 21l1.8-1.8-4.7-4.7 1.4-1.4 4.7 4.7L21 16v5h-5zM4.1 3.9L3 5l1.8 1.8 4.7-4.7L11 4V3H6l1.9 1.9-3.8-1z"/></svg>
      Shuffle Deck
    </button>
    <button class="btn" onclick="confirmReset()">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
      Reset Activity
    </button>
  </div>
  <div class="toolbar-hint">Click a card to flip it. Hover over a flipped card to enlarge it.</div>
</div>

<!-- ── MAIN ───────────────────────────────────────────────── -->
<main id="mainContent"></main>

<script>
// ── CARD DATA ─────────────────────────────────────────────────────────────────
const CARD_FILES = [
  'card_01_flat_tire','card_02_phone_screen_cracks','card_03_bad_nights_sleep',
  'card_04_spilled_coffee','card_05_forgot_lunch','card_06_speeding_ticket',
  'card_07_caught_cold','card_08_missed_deadline','card_09_found_20',
  'card_10_unexpected_refund','card_11_sent_to_er','card_12_got_laid_off',
  'card_13_full_burnout','card_14_maxed_out','card_15_inheritance',
  'card_16_promotion','card_17_running_on_caffeine','card_18_anxiety_spike',
  'card_19_gym_paying_off','card_20_threw_out_back','card_21_skipped_doctor',
  'card_22_therapy_helps','card_23_havent_slept','card_24_finally_rested',
  'card_25_no_time_yourself','card_26_hobby_wins','card_27_downtime_cancelled',
  'card_28_annual_review','card_29_last_minute_project','card_30_rent_went_up',
  'card_31_money_set_aside','card_32_grocery_doubled','card_33_pipe_burst',
  'card_34_home_refuge','card_35_insurance','card_36_job_security',
  'card_37_family_emergency','card_38_friends_rally','card_39_eating_alone',
  'card_40_found_people','card_41_fight_someone','card_42_someone_checks_in',
  'card_43_coworker_harder','card_44_certification','card_45_lost_sight',
  'card_46_found_why','card_47_no_choice','card_48_set_boundary',
  'card_49_passed_over','card_50_too_many_directions'
];

const ROUNDS = [3, 4, 5];
const MAX_PER_ROUND = 10;

// ── STATE ─────────────────────────────────────────────────────────────────────
let deck = [];
let rounds = ROUNDS.map(() => ({ roll: null, drawn: [], flipped: [] }));

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initDeck() {
  deck = shuffle([...CARD_FILES]);
}

function totalDrawn() {
  return rounds.reduce((sum, r) => sum + r.drawn.length, 0);
}

function updatePill() {
  const rem = 50 - totalDrawn();
  document.getElementById('cardsRemaining').innerHTML = `${rem}<span>/50</span>`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  updatePill();
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  ROUNDS.forEach((roundNum, ri) => {
    const state = rounds[ri];
    const row = document.createElement('div');
    row.className = 'round-row' + (state.roll !== null ? ' active' : '');

    // Only show slots after roll
    if (state.roll === null) {
      row.innerHTML = `
        <div class="round-label">
          <div class="round-word">Round</div>
          <div class="round-num">${roundNum}</div>
        </div>
        <div class="round-controls">
          <div class="ctrl-label">D6 Roll</div>
          <button class="roll-btn" onclick="rollDie(${ri})">Roll D6</button>
          <div class="die-display" id="die${ri}">–</div>
          <div class="drawn-count">Waiting</div>
        </div>
        <div class="card-grid" id="grid${ri}"></div>
      `;
      main.appendChild(row);
      return;
    }
    const slots = state.roll;

    row.innerHTML = `
      <div class="round-label">
        <div class="round-word">Round</div>
        <div class="round-num">${roundNum}</div>
      </div>
      <div class="round-controls">
        <div class="ctrl-label">D6 Roll</div>
        <button class="roll-btn" id="rollBtn${ri}" onclick="rollDie(${ri})" ${state.roll !== null ? 'disabled' : ''}>Roll D6</button>
        <div class="die-display ${state.roll !== null ? 'rolled' : ''}" id="die${ri}">${state.roll !== null ? state.roll : '–'}</div>
        <div class="drawn-count">${state.roll !== null ? state.drawn.length + ' drawn' : 'Waiting'}</div>
      </div>
      <div class="card-grid" id="grid${ri}"></div>
    `;

    main.appendChild(row);

    const grid = document.getElementById(`grid${ri}`);

    for (let si = 0; si < slots; si++) {
      const slot = document.createElement('div');
      const isDrawn = si < state.drawn.length;
      const isFlipped = state.flipped[si];
      slot.className = `card-slot ${isDrawn ? (isFlipped ? 'flipped' : '') : 'undrawn'}`;
      slot.dataset.round = ri;
      slot.dataset.slot = si;

      if (isDrawn) {
        const cardFile = state.drawn[si];
        slot.innerHTML = `
          <div class="card-inner">
            <div class="card-back"><img src="assets/Image 1.png" alt="card back" style="width:100%;height:100%;object-fit:contain;"/></div>
            <div class="card-face">
              <div class="card-svg-wrapper">
                <img src="assets/${cardFile}.svg" alt="${cardFile}" loading="lazy"/>
              </div>
            </div>
          </div>
        `;
        slot.addEventListener('click', () => flipCard(ri, si));
        slot.addEventListener('mouseenter', (e) => showEnlarged(e, cardFile));
        slot.addEventListener('mouseleave', hideEnlarged);
      } else {
        slot.innerHTML = `
          <div class="card-inner">
            <div class="card-back"><img src="assets/Image 1.png" alt="card back" style="width:100%;height:100%;object-fit:contain;"/></div>
            <div class="card-face"></div>
          </div>
        `;
      }

      grid.appendChild(slot);
    }
  });
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function rollDie(ri) {
  const roll = Math.floor(Math.random() * 6) + 1;
  rounds[ri].roll = roll;

  // Draw that many cards from the deck
  for (let i = 0; i < roll; i++) {
    if (deck.length > 0) {
      rounds[ri].drawn.push(deck.pop());
    }
  }
  rounds[ri].flipped = new Array(rounds[ri].drawn.length).fill(false);
  render();
}

function flipCard(ri, si) {
  if (si >= rounds[ri].drawn.length) return;
  rounds[ri].flipped[si] = !rounds[ri].flipped[si];
  const slot = document.querySelector(`[data-round="${ri}"][data-slot="${si}"]`);
  if (slot) slot.classList.toggle('flipped', rounds[ri].flipped[si]);
}

// Centered modal on hover
function showEnlarged(e, cardFile) {
  const slot = e.currentTarget;
  if (!slot.classList.contains('flipped')) return;
  const modal = document.getElementById('cardModal');
  const img = document.getElementById('cardModalImg');
  img.src = 'assets/' + cardFile + '.svg';
  modal.classList.add('visible');
}
function hideEnlarged() {
  document.getElementById('cardModal').classList.remove('visible');
}

function shuffleDeck() {
  deck = shuffle([...deck]);
  render();
}

function confirmReset() {
  if (confirm('Reset the activity and return all cards to the deck?')) {
    initDeck();
    rounds = ROUNDS.map(() => ({ roll: null, drawn: [], flipped: [] }));
    render();
  }
}

// ── FIRE PARTICLE SYSTEM ──────────────────────────────────────────────────────
(function() {
  const cv = document.getElementById('fireCanvas');
  const cx = cv.getContext('2d');
  let W, H, parts = [];
  const EMITTERS = 20;

  function resize() {
    W = cv.width = cv.offsetWidth;
    H = cv.height = 200;
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawn() {
    const slot = Math.floor(Math.random() * EMITTERS);
    const x = (W / (EMITTERS - 1)) * slot + rand(-W / EMITTERS * 0.5, W / EMITTERS * 0.5);
    const life = rand(55, 130);
    return { x, y: H, vx: rand(-0.5, 0.5), vy: rand(-3.2, -1.6),
             life, maxLife: life, r: rand(16, 48), w: rand(0, Math.PI * 2),
             ws: rand(0.03, 0.1), ember: Math.random() < 0.12 };
  }

  function color(p) {
    const t = 1 - p.life / p.maxLife;
    if (p.ember) { const a = Math.max(0.9 - t * 1.1, 0); return `rgba(255,${Math.round(220 - t * 180)},0,${a})`; }
    if (t < 0.18) return `rgba(255,${Math.round(255 - t * 500)},${Math.round(200 - t * 1000)},${0.88 - t * 0.2})`;
    if (t < 0.48) return `rgba(255,${Math.round(180 - (t - 0.18) * 380)},0,${0.85 - t * 0.35})`;
    if (t < 0.75) return `rgba(${Math.round(255 - (t - 0.48) * 350)},${Math.round(40 - (t - 0.48) * 100)},0,${0.65 - t * 0.45})`;
    return `rgba(30,5,0,${Math.max(0.25 - (t - 0.75) * 1.0, 0)})`;
  }

  function frame() {
    for (let i = 0; i < Math.round(EMITTERS * 0.8); i++) parts.push(spawn());
    parts = parts.filter(p => p.life > 0);
    parts.forEach(p => {
      p.life--; p.y += p.vy; p.x += p.vx + Math.sin(p.w) * 0.45;
      p.vy *= 0.988; p.vx *= 0.995; p.w += p.ws; p.r *= 0.996;
      if (p.ember) { p.vy += 0.06; p.vx += rand(-0.08, 0.08); }
    });
    if (parts.length > 2000) parts.splice(0, parts.length - 2000);

    cx.clearRect(0, 0, W, H);
    const bg = cx.createLinearGradient(0, H * 0.55, 0, H);
    bg.addColorStop(0, 'rgba(255,60,0,0)');
    bg.addColorStop(0.55, 'rgba(255,30,0,0.28)');
    bg.addColorStop(1, 'rgba(180,10,0,0.52)');
    cx.fillStyle = bg; cx.fillRect(0, 0, W, H);

    parts.forEach(p => {
      const c = color(p);
      if (p.ember) {
        cx.beginPath(); cx.arc(p.x, p.y, Math.max(p.r * 0.1, 1.2), 0, Math.PI * 2);
        cx.fillStyle = c; cx.shadowBlur = 10; cx.shadowColor = 'rgba(255,180,0,0.9)';
        cx.fill(); cx.shadowBlur = 0;
      } else {
        const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)');
        cx.beginPath(); cx.ellipse(p.x, p.y, p.r * 0.52, p.r, 0, 0, Math.PI * 2);
        cx.fillStyle = g; cx.fill();
      }
    });
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize(); frame();
})();

// ── INIT ──────────────────────────────────────────────────────────────────────
initDeck();
render();
</script>
</body>
</html>
